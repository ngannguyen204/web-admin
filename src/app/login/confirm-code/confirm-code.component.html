<div class="confirm-code-container">
    <!-- Left logo section -->
    <div class="logo-section">
      <img src="assets/image/logo (2).png" class="logo" />
    </div>
  
    <!-- Right form section -->
    <div class="form-section">
      <form (submit)="onConfirmCode()">
        <h2 class="title">Verification Code</h2>
        <p class="subtitle">Please enter the code sent to your email</p>
  
        <!-- Email input -->
        <div class="input-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            required 
            readonly
          />
        </div>
  
        <!-- Code input -->
        <div class="input-group">
          <label for="code">Verification Code</label>
          <div class="password-wrapper">
            <input 
              [type]="codeFieldType" 
              id="code" 
              [(ngModel)]="code" 
              name="code" 
              required
              placeholder="Enter 6-digit code"
            />
            <span class="toggle-password" (click)="toggleCodeVisibility()">
              <i class="material-icons">
                {{ codeFieldType === 'password' ? 'visibility' : 'visibility_off' }}
              </i>
            </span>
          </div>
        </div>
  
        <!-- Options section -->
        <div class="options">
          <label>
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            Remember me
          </label>
          <a routerLink="/forgot-password" class="forgot-password">Forgot password?</a>
        </div>
  
        <!-- Confirm button -->
        <button type="submit" class="confirm-button">Verify Code</button>
      </form>
    </div>
  </div>
  
  <!-- Popup HTML -->
  <div class="popup-overlay" *ngIf="showPopup">
    <div class="popup-content">
      <p>{{ popupMessage }}</p>
      <button (click)="closePopup()">Close</button>
    </div>
  </div>
