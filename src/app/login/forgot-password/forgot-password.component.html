<div class="forgot-password-container">
  <div class="form-section">
    <a routerLink="/login" class="back-link">← Back to login</a>

    <!-- Xóa ng-container kiểm tra isConfirmStep -->
    <h2 class="title">Forgot your password?</h2>
    <p class="subtitle">Enter your email to receive a recovery code.</p>
    
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="email" required />
    </div>

    <button (click)="onSubmit()" class="submit-button">Send</button>
  </div>
  
  <div class="logo-section">
    <img src="assets/image/logo (2).png" class="logo" />
  </div>
</div>

<!-- Popup HTML -->
<div class="popup-overlay" *ngIf="showPopup">
  <div class="popup-content">
    <p>{{ popupMessage }}</p>
    <button (click)="closePopup()">Close</button>
  </div>
</div>
