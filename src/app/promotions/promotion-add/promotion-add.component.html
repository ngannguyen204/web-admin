<div class="promotion-add-container">
  <h2>{{ isEditing ? "Edit" : "Add" }} Promotion</h2>
  <form (ngSubmit)="savePromotion()">
    <div class="form-grid">
      <div class="form-group">
        <label>Promotion Code</label>
        <input type="text" [(ngModel)]="promotion.promotioncode" name="promotioncode" placeholder="Enter promotion code">
      </div>
      <div class="form-group">
        <label>Discount Value</label>
        <input type="number" [(ngModel)]="promotion.discountvalue" name="discountvalue" placeholder="Enter discount value">
      </div>
      <div class="form-group">
        <label>Discount Type</label>
        <select [(ngModel)]="promotion.discounttype" name="discounttype">
          <option value="percentage">Percentage</option>
          <option value="fixed">Fixed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" [(ngModel)]="promotion.category" name="category" placeholder="Enter applicable category">
      </div>
      <div class="form-group">
        <label>Valid From</label>
        <input type="date" [(ngModel)]="startDateString" name="validfrom">
      </div>
      <div class="form-group">
        <label>Valid Until</label>
        <input type="date" [(ngModel)]="endDateString" name="validuntil">
      </div>
    </div>
    <div class="button-group">
      <button class="add-btn" type="submit">{{ isEditing ? "Update" : "Add" }}</button>
      <button class="close-btn" type="button" (click)="cancelAdd()">Cancel</button>
    </div>
  </form>
</div>

<div *ngIf="showPopup" class="confirm-dialog">
  <div class="dialog-content">
    <p>{{ popupMessage }}</p>
    <div class="dialog-actions">
      <button (click)="closePopup()" class="confirm-btn">Close</button>
    </div>
  </div>
</div>
