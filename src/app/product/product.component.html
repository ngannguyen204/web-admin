<div class="product-container" *ngIf="!isAdding">
  <h2>Product Management</h2>

  <div class="header-container">
    <button class="add-button" (click)="showAddForm()">➕ Add Product</button>
    <div class="search-bar">
      <input 
        type="text" 
        [(ngModel)]="searchText" 
        (input)="searchProducts()" 
        placeholder="🔍 Search product..."
      >
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of paginatedProducts">
        <td>#{{ product.productid }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency:'VND' }}</td>
        <td>{{ product.stock }}</td>
        <td>{{ product.categoryid }}</td>
        <td>
          <button (click)="editProduct(product)">✏️</button>
          <button (click)="confirmDelete(product)">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="currentPage === 1">‹</button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="currentPage >= totalPages">›</button>
  </div>
</div>

<!-- Product Add/Edit Form -->
<app-product-add  
   *ngIf="isAdding" 
   [product]="selectedProduct" 
   (save)="addProduct($event)" 
   (close)="hideForm()">
</app-product-add>

<!-- Confirm Delete Popup -->
<div *ngIf="showConfirmDelete" class="popup">
  <p>Are you sure you want to delete product "{{ selectedProduct.name }}"?</p>
  <div class="button-group">
    <button (click)="deleteProduct()">✅ Confirm</button>
    <button (click)="hideDeletePopup()">❌ Cancel</button>
  </div>
</div>
